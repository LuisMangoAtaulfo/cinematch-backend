name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # application-test.properties usa H2 en memoria, sin necesitar PostgreSQL.
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
