name: Deploy Backend to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -q
        shell: bash

      - name: Verify JAR was created
        run: |
          if [ ! -f target/cinematch-backend-0.0.1-SNAPSHOT.jar ]; then
            echo "❌ JAR file not found!"
            exit 1
          fi
          ls -lh target/cinematch-backend-0.0.1-SNAPSHOT.jar
        shell: bash

      - name: Backup current version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/cinematch/backups
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            if [ -f /opt/cinematch/cinematch-backend.jar ]; then
              sudo cp /opt/cinematch/cinematch-backend.jar /opt/cinematch/backups/cinematch-backend_$TIMESTAMP.jar
              echo "✅ Backup created: cinematch-backend_$TIMESTAMP.jar"
            else
              echo "ℹ️ No existing JAR to backup (first deploy?)"
            fi

      - name: Stop backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl stop cinematch-backend
            echo "✅ Backend service stopped"

      - name: Transfer JAR to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/cinematch-backend-0.0.1-SNAPSHOT.jar"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy new JAR
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/cinematch-backend-0.0.1-SNAPSHOT.jar /opt/cinematch/cinematch-backend.jar
            sudo chown mangouser:mangouser /opt/cinematch/cinematch-backend.jar
            echo "✅ JAR deployed to /opt/cinematch/"

      - name: Start backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl start cinematch-backend
            sleep 10
            sudo systemctl status cinematch-backend --no-pager | head -15
            echo "✅ Backend service started"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in {1..30}; do
              if sudo systemctl is-active --quiet cinematch-backend; then
                echo "✅ Backend is running!"
                exit 0
              fi
              echo "Waiting for backend to start... ($i/30)"
              sleep 2
            done
            echo "❌ Backend failed to start within 60 seconds"
            sudo journalctl -u cinematch-backend -n 50 --no-pager
            exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## 🚀 Backend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** http://${{ secrets.VM_HOST }}:8080" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
